name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches downloaded crates and compiled dependencies between runs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Runs the Tauri CLI through npx so cargo-tauri doesn't have to be
      # compiled on every build. Builds ai-browser.exe and the NSIS installer.
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ai-browser-windows
          path: |
            src-tauri/target/release/ai-browser.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Only when you push a tag such as v0.1.0
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/ai-browser.exe
            src-tauri/target/release/bundle/nsis/*.exe
